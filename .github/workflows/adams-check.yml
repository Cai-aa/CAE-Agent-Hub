name: Adams bridge checks

on:
  push:
    paths: ['MCP/Adams/**', 'Skill/Adams/**', '.github/workflows/adams-check.yml']
  pull_request:
    paths: ['MCP/Adams/**', 'Skill/Adams/**', '.github/workflows/adams-check.yml']

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ./MCP/Adams
      - run: python -m unittest discover -s MCP/Adams/tests -v
      - run: python MCP/Adams/scripts/protocol_smoke.py
