[project]
name = "ansa-mcp"
version = "0.5.0"
description = "Local FastMCP bridge for controlled ANSA automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ansa-mcp = "ansa_mcp.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

