[mcp_servers.hyperworks]
command = "<REPOSITORY_ROOT>\\MCP\\HyperWorks\\.venv\\Scripts\\python.exe"
args = ["-m", "hyperworks_mcp"]
cwd = "<REPOSITORY_ROOT>\\MCP\\HyperWorks"
startup_timeout_sec = 30
tool_timeout_sec = 300

[mcp_servers.hyperworks.env]
HYPERWORKS_HOME = "<HYPERWORKS_INSTALL_ROOT>"
HYPERWORKS_MCP_WORKSPACE = "<WRITABLE_WORKSPACE_PATH>"
# Optional; omit to use the current user's LocalAppData directory.
# HYPERWORKS_MCP_BRIDGE_CONFIG = "<BRIDGE_CONFIG_PATH>"
HYPERWORKS_DEFAULT_NCPU = "4"
HYPERWORKS_MAX_NCPU = "32"
PYTHONUTF8 = "1"

# If solvers are installed outside HYPERWORKS_HOME, add one or both:
# OPTISTRUCT_EXECUTABLE = "<OPTISTRUCT_LAUNCHER_PATH>"
# RADIOSS_EXECUTABLE = "<RADIOSS_LAUNCHER_PATH>"
