[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ansys-common-mcp"
version = "0.4.dev0"
description = "Common Model Context Protocol (MCP) server for PyAnsys libraries"
readme = "README.md"
requires-python = ">=3.12,<4"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" }
]
maintainers = [
    { name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" }
]
keywords = [
    "ansys",
    "mcp",
    "model-context-protocol",
    "ai",
    "assistant"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "mcp>=0.1.0",
    "fastmcp>=3.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
tests = [
    "pydantic-settings==2.14.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "mcp==1.28.1",
    "fastmcp==3.4.5",
]
doc = [
    "Sphinx==9.1.0",
    "ansys-sphinx-theme[autoapi,changelog]==1.10.0",
    "build>= 0.10.0",
    "flit>=3.8.0",
    "inflect==7.5.0",
    "jupyter_sphinx==0.5.3",
    "numpy==2.5.1",
    "numpydoc==1.10.0",
    "pandas==3.0.5",
    "parse==1.22.1",
    "pydantic-settings==2.14.2",
    "pypandoc==1.17",
    "pytest-sphinx==0.7.1",
    "regex==2026.7.10",
    "sphinx-autobuild==2025.8.25",
    "sphinx-autodoc-typehints==3.13.2",
    "sphinx-copybutton==0.5.2",
    "sphinx-notfound-page==1.1.0",
    "sphinx-gallery==0.21.0",
    "sphinxcontrib-mermaid>=0.9.2"
]

[project.urls]
Homepage = "https://github.com/ansys/pyansys-common-mcp"
Documentation = "https://github.com/ansys/pyansys-common-mcp#readme"
Repository = "https://github.com/ansys/pyansys-common-mcp"
Issues = "https://github.com/ansys/pyansys-common-mcp/issues"

[project.scripts]
ansys-common-mcp = "ansys.common.mcp.__main__:main"

[tool.flit.module]
name = "ansys.common.mcp"

[tool.ruff]
line-length = 100
fix = true
format.indent-style = "space"
format.quote-style = "double"
format.docstring-code-line-length = "dynamic"
format.docstring-code-format = true
lint.select = [
  "D",   # pydocstyle, see https://docs.astral.sh/ruff/rules/#pydocstyle-d
  "E",   # pycodestyle, see https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
  "F",   # pyflakes, see https://docs.astral.sh/ruff/rules/#pyflakes-f
  "I",   # isort, see https://docs.astral.sh/ruff/rules/#isort-i
  "N",   # pep8-naming, see https://docs.astral.sh/ruff/rules/#pep8-naming-n
  "PTH", # flake8-use-pathlib, https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
  "TD",  # flake8-todos, https://docs.astral.sh/ruff/rules/#flake8-todos-td
]
lint.ignore = [
  "TD002", # Missing author in TODOs comment
]
# Ignore `D` rules everywhere except for the `src/` directory.
lint.per-file-ignores."!src/**.py" = [ "D" ]
# Ignore `F401` (import violations) in all `__init__.py` files.
lint.per-file-ignores."__init__.py" = [ "F401" ]
# Ignore `E402` (module level import not at top of file) in `src/ansys/common/mcp/__init__.py`.
lint.per-file-ignores."src/ansys/common/mcp/__init__.py" = [ "E402" ]
lint.isort.combine-as-imports = true
lint.isort.force-sort-within-sections = true
lint.isort.known-first-party = [ "ansys.common.mcp" ]
lint.pydocstyle.convention = "numpy"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
exclude = [
    "^\\.venv/",
    "^venv/",
    "^build/",
    "^dist/"
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--verbose",
    "--cov=ansys.common.mcp",
    "--cov=pyexample_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml"
]

[tool.towncrier]
package = "ansys.common.mcp"
directory = "doc/changelog.d"
filename = "doc/source/changelog.rst"
template = "doc/changelog.d/changelog_template.jinja"
start_string = ".. towncrier release notes start\n"
title_format = "`{version} <https://github.com/ansys/pyansys-common-mcp/releases/tag/v{version}>`_ - {project_date}"
issue_format = "`#{issue} <https://github.com/ansys/pyansys-common-mcp/pull/{issue}>`_"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "dependencies"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "maintenance"
name = "Maintenance"
showcontent = true

[[tool.towncrier.type]]
directory = "miscellaneous"
name = "Miscellaneous"
showcontent = true

[[tool.towncrier.type]]
directory = "test"
name = "Test"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true
