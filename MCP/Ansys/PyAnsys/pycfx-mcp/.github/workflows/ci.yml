name: CI/CD

on:
  pull_request:
  push:
    tags:
      - "v*"
    branches:
       - main
  schedule:
    - cron:  '30 4 * * *'  # Daily at 04:30 UTC

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MAIN_PYTHON_VERSION: "3.13"
  PACKAGE_NAME: "ansys-cfx-mcp"
  DOCUMENTATION_CNAME: "cfx-mcp.docs.pyansys.com"

jobs:
  update-changelog:
    name: "Update CHANGELOG (on release)"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to read and write repository contents
      pull-requests: write # Needed to create pull requests
    steps:
      - uses: ansys/actions/doc-deploy-changelog@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  code-style:
    name: "Code style checks"
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed to checkout the code
    steps:
      - name: "Run PyAnsys code style checks"
        uses: ansys/actions/code-style@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  docs-style:
    name: "Documentation style checks"
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed to checkout the code
    steps:
      - name: "Run Ansys documentation style checks"
        uses: ansys/actions/doc-style@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  pr-name:
    if: github.event_name == 'pull_request'
    name: "Check the name of the PR"
    permissions:
      contents: read
      pull-requests: read # Needed to read pull request title for checks
    runs-on: ubuntu-latest
    steps:
      - name: Check commit name
        uses: ansys/actions/check-pr-title@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  actions-security:
    name: "Actions security"
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed to checkout and scan workflows
    steps:
      - uses: ansys/actions/check-actions-security@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          generate-summary: true
          token: ${{ secrets.GITHUB_TOKEN }}
          auditing-level: 'high'

  vulnerabilities:
    name: "Vulnerabilities"
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed to checkout the code
    steps:
      - uses: ansys/actions/check-vulnerabilities@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          python-package-name: ${{ env.PACKAGE_NAME }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          dev-mode: ${{ github.ref != 'refs/heads/main' }}

  smoke-tests:
    name: "Build and smoke tests"
    runs-on: ${{ matrix.os }}
    needs: [code-style]
    permissions:
      contents: read # Needed to checkout the code
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14']
        should-release:
          - ${{ github.event_name == 'push' && contains(github.ref, 'refs/tags') }}
        exclude:
          - should-release: false
            os: macos-latest
    steps:
      - name: "Build wheelhouse and perform smoke test"
        uses: ansys/actions/build-wheelhouse@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          library-name: ${{ env.PACKAGE_NAME }}
          operating-system: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}

  test:
    name: "Test Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    needs: [smoke-tests]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: "Run unit tests"
        uses: ansys/actions/tests-pytest@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          python-version: ${{ matrix.python-version }}
          pytest-markers: '-m "not integration"'
          group-dependencies-name: tests

      # TODO: this will be enabled once public
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      #   if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      #   with:
      #     file: ./coverage.xml
      #     flags: unittests
      #     name: codecov-umbrella
      #     fail_ci_if_error: false

  integration:
    name: "Integration tests (live CFX)"
    runs-on: [public-ubuntu-latest-8-cores]
    needs: [smoke-tests]
    permissions:
      contents: read
      packages: read # Required to pull the CFX container image from GitHub Container Registry
    env:
      ANSYSLMD_LICENSE_FILE: "1055@${{ secrets.LICENSE_SERVER }}"
      PYCFX_MCP_RUN_INTEGRATION: "1"
      PYCFX_MCP_LAUNCHER: from_container
      PYCFX_MCP_CFX_IMAGE: ghcr.io/ansys/pycfx:v26.1.0
      PYCFX_MCP_LICENSE_SERVER: "1055@${{ secrets.LICENSE_SERVER }}"
    steps:
      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Pull CFX docker image"
        run: docker pull "${PYCFX_MCP_CFX_IMAGE}"

      - name: "Run live CFX integration tests"
        uses: ansys/actions/tests-pytest@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          group-dependencies-name: tests
          pytest-markers: '-m "integration"'

  build-docs:
    name: "Build documentation"
    runs-on: ubuntu-latest
    needs: [docs-style]
    permissions:
      contents: read # Needed to checkout the code
    steps:
      - name: "Run Ansys documentation building action"
        uses: ansys/actions/doc-build@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          sphinxopts: '-W --keep-going'
          group-dependencies-name: doc

  package:
    name: "Package library"
    needs: [test, integration, build-docs]
    runs-on: ubuntu-latest
    permissions:
      attestations: write # Required to upload provenance attestations
      contents: read
      id-token: write # Required for OIDC authentication to upload provenance attestations
    steps:
      - name: "Build library source and wheel artifacts"
        uses: ansys/actions/build-library@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          library-name: ${{ env.PACKAGE_NAME }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          attest-provenance: true

  doc-deploy-dev:
    name: "Deploy development documentation"
    # Deploy development only when merging to main
    if: github.ref == 'refs/heads/main'  && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push documentation to gh-pages branch
    needs: [package]
    steps:
      - name: "Deploy the latest documentation"
        uses: ansys/actions/doc-deploy-dev@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  doc-deploy-pr:
    name: "Deploy PR documentation"
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pr-preview')
    runs-on: ubuntu-latest
    needs: [build-docs]
    permissions:
      contents: write # Needed to push documentation to gh-pages branch
    steps:
      - name: "Deploy the PR documentation"
        uses: ansys/actions/doc-deploy-pr@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
          maximum-pr-doc-deployments: 10

  release:
    name: "Release project"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [package, update-changelog]
    runs-on: ubuntu-latest
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment: release
    permissions:
      id-token: write # Required for GitHub release
      contents: write # Required for GitHub release
    steps:
      - name: "Release to GitHub"
        uses: ansys/actions/release-github@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          library-name: ${{ env.PACKAGE_NAME }}
          add-artifact-attestation-notes: true
          changelog-release-notes: true

      - name: "Release to PyPI"
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: dist/${{ env.PACKAGE_NAME }}-artifacts
          skip-existing: false

  doc-deploy-stable:
    name: "Deploy stable documentation"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push documentation to gh-pages branch
    needs: [release]
    steps:
      - name: "Deploy the stable documentation"
        uses: ansys/actions/doc-deploy-stable@3ad3b285bd9b67045477dafc7f9865a3aa39f692 #v11.0.6
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          render-last: '5'
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
